name: Flutter Android App Bundle Build and Publish
run-name: "CouldAI Build #${{ inputs.build_id }}"
on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
        type: string
      project_id:
        required: true
        type: string
      version_id:
        required: true
        type: string
      archive_url:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string
      environment_name:
        required: true
        type: string
jobs:
  flutter_android_bundle_build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: ${{ inputs.environment_name }}
    steps:
      - name: Install archive dependency
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Download project source from R2
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          curl --fail --location --retry 3 "$ARCHIVE_URL" --output project.tar.zst
          echo "$ARCHIVE_SHA256  project.tar.zst" | sha256sum --check -
          mkdir -p usr
          tar --use-compress-program=unzstd -xf project.tar.zst -C usr
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install Fastlane
        run: gem install fastlane
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - name: Get dependencies
        working-directory: ./usr
        run: flutter pub get
      - name: Setup Android signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          KEYSTORE_PATH="$(pwd)/keystore.jks"
          echo "storeFile=$KEYSTORE_PATH" > ./usr/android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> ./usr/android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> ./usr/android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> ./usr/android/key.properties
          KEYSTORE_INFO="$(keytool -list -v -keystore keystore.jks -alias "${{ secrets.ANDROID_KEY_ALIAS }}" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}")"
          if echo "$KEYSTORE_INFO" | grep -qi "Owner: CN=Android Debug"; then
            echo "::error::The configured Android keystore is a debug keystore."
            exit 1
          fi
      - name: Build Android App Bundle
        working-directory: ./usr
        run: flutter build appbundle --release
      - name: Verify app bundle signing
        run: |
          AAB_PATH=./usr/build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$AAB_PATH" > app-bundle-signing-report.txt 2>&1
          grep -qi "jar verified" app-bundle-signing-report.txt
          if grep -qi "CN=Android Debug" app-bundle-signing-report.txt; then
            echo "::error::The generated app bundle is signed with a debug certificate."
            exit 1
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-release-bundle
          path: ./usr/build/app/outputs/bundle/release/*.aab
          retention-days: 7
      - name: Create Android Fastfile
        run: |
          mkdir -p ./usr/android/fastlane
          cat > ./usr/android/fastlane/Fastfile <<'FASTFILE'
          opt_out_usage
          default_platform(:android)

          platform :android do
            lane :publish_to_play_store do
              begin
                upload_to_play_store(package_name: ENV['PACKAGE_NAME'], track: 'internal', aab: '../build/app/outputs/bundle/release/app-release.aab', json_key_data: ENV['GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'], skip_upload_metadata: true, skip_upload_images: true, skip_upload_screenshots: true, release_status: 'completed')
              rescue => error
                if error.to_s.include?("Only releases with status draft may be created on draft app")
                  upload_to_play_store(package_name: ENV['PACKAGE_NAME'], track: 'internal', aab: '../build/app/outputs/bundle/release/app-release.aab', json_key_data: ENV['GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'], skip_upload_metadata: true, skip_upload_images: true, skip_upload_screenshots: true, release_status: 'draft')
                else
                  raise error
                end
              end
            end
          end
          FASTFILE
      - name: Deploy to Google Play
        id: deploy_to_google_play
        working-directory: ./usr/android
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        run: fastlane publish_to_play_store
