name: Flutter Linux Build
run-name: "CouldAI Build #${{ inputs.build_id }}"
on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
        type: string
      project_id:
        required: true
        type: string
      version_id:
        required: true
        type: string
      archive_url:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string
      environment_name:
        required: true
        type: string
jobs:
  flutter_linux_build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev zstd
      - name: Download project source from R2
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          curl --fail --location --retry 3 "$ARCHIVE_URL" --output project.tar.zst
          echo "$ARCHIVE_SHA256  project.tar.zst" | sha256sum --check -
          mkdir -p usr
          tar --use-compress-program=unzstd -xf project.tar.zst -C usr
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - name: Get dependencies
        working-directory: ./usr
        run: flutter pub get
      - name: Enable Linux
        working-directory: ./usr
        run: flutter config --enable-linux-desktop
      - name: Build Linux application
        working-directory: ./usr
        run: flutter build linux --release
      - name: Create tar archive
        run: tar -czf linux-app.tar.gz -C ./usr/build/linux/x64/release/bundle .
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-release-build
          path: linux-app.tar.gz
          retention-days: 7
